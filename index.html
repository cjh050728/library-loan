<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서관 대출</title>
<style>
  :root {
    --bg: #f4f2ec;
    --card: #ffffff;
    --ink: #1c1f24;
    --muted: #6a6f77;
    --line: #e2ded4;
    --field: #faf9f6;

    --borrow: #2f5d50;
    --borrow-soft: #e6f0ec;
    --return: #3b5b8c;
    --return-soft: #e7edf6;
    --list: #7a5a2b;
    --list-soft: #f4ecdf;

    --ok-bg: #e3f3e8;
    --ok-ink: #17643a;
    --ok-line: #9fd4b2;
    --bad-bg: #fde7e7;
    --bad-ink: #b42318;
    --bad-line: #f2a7a2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  /* 상단 */
  header {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 16px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  #status {
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    background: #fff4cc;
    color: #7a5b00;
    white-space: nowrap;
  }
  #status::before { content: "● "; }
  #status.ready { background: var(--ok-bg); color: var(--ok-ink); }
  #status.error { background: var(--bad-bg); color: var(--bad-ink); white-space: normal; }

  /* 배치: 넓은 화면은 대출·반납 나란히 + 목록 아래 전체 폭 / 좁은 화면은 한 줄씩 */
  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 8px 16px 48px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  #listCard { grid-column: 1 / -1; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    header { padding-top: 24px; }
    h1 { font-size: 24px; }
  }

  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    border-top: 6px solid var(--tone);
  }
  #borrowCard { --tone: var(--borrow); --soft: var(--borrow-soft); }
  #returnCard { --tone: var(--return); --soft: var(--return-soft); }
  #listCard   { --tone: var(--list);   --soft: var(--list-soft); }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .badge {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--soft);
    color: var(--tone);
    display: grid; place-items: center;
    font-size: 18px;
  }
  h2 { margin: 0; font-size: 20px; }
  .desc { margin: 0 0 8px; color: var(--muted); font-size: 14px; }

  /* 입력칸 */
  .fields { display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 10px; }
  .fields.one { grid-template-columns: 1fr; }
  @media (max-width: 420px) { .fields { grid-template-columns: 1fr; } }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
  input {
    width: 100%;
    height: 52px;
    font-size: 17px;
    padding: 0 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
  }
  input::placeholder { color: #a5a49f; }
  input:focus { outline: none; border-color: var(--tone); background: #fff; box-shadow: 0 0 0 3px var(--soft); }

  button {
    margin-top: 16px;
    width: 100%;
    height: 54px;
    font-size: 17px;
    font-weight: 700;
    border: 0;
    border-radius: 10px;
    background: var(--tone);
    color: #fff;
    cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* 결과 */
  .result {
    margin-top: 16px;
    border-radius: 12px;
    padding: 16px 18px;
    border: 2px solid transparent;
    display: none;
    align-items: center;
    gap: 14px;
  }
  .result.show { display: flex; }
  .result .icon {
    flex: 0 0 auto;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 24px; font-weight: 900;
    color: #fff;
  }
  .result .label { display: block; font-size: 14px; font-weight: 600; opacity: .85; }
  .result .big { display: block; font-size: 32px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
  .result .detail { display: block; font-size: 14px; margin-top: 2px; }
  .result.ok  { background: var(--ok-bg);  color: var(--ok-ink);  border-color: var(--ok-line); }
  .result.ok .icon  { background: var(--ok-ink); }
  .result.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-line); }
  .result.bad .icon { background: var(--bad-ink); }

  /* 대출 목록 */
  .listRow { display: grid; grid-template-columns: 1fr 180px; gap: 10px; align-items: end; }
  .listRow button { margin-top: 0; }
  @media (max-width: 480px) { .listRow { grid-template-columns: 1fr; } }
  #loansResult { margin-top: 16px; }
  .who { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .tableWrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  thead th {
    background: var(--soft);
    color: var(--tone);
    text-align: left;
    font-size: 14px;
    padding: 12px 16px;
  }
  td { padding: 14px 16px; border-top: 1px solid var(--line); }
  tbody tr:nth-child(even) td { background: #fbfaf7; }
  td.num { color: var(--muted); width: 56px; }
  td.book { font-weight: 700; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .empty {
    padding: 22px;
    text-align: center;
    color: var(--muted);
    background: var(--field);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    font-size: 15px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>📚 도서관 대출</h1>
    <p class="sub">책 B001 ~ B005 · 날짜는 도서관 문 연 날부터 센 "며칠째"</p>
  </div>
  <div id="status">시스템 불러오는 중… (처음엔 10초쯤 걸려요)</div>
</header>

<main>
  <section id="borrowCard">
    <div class="head"><div class="badge">📖</div><h2>대출</h2></div>
    <p class="desc">책을 빌려요.</p>
    <form id="borrowForm">
      <div class="fields">
        <div><label for="bBook">책 번호</label><input id="bBook" placeholder="B001" autocomplete="off"></div>
        <div><label for="bName">이름</label><input id="bName" placeholder="김민수" autocomplete="off"></div>
        <div><label for="bDay">며칠째</label><input id="bDay" placeholder="1" autocomplete="off"></div>
      </div>
      <button type="submit" disabled>대출하기</button>
    </form>
    <div id="borrowResult" class="result" aria-live="polite"></div>
  </section>

  <section id="returnCard">
    <div class="head"><div class="badge">↩️</div><h2>반납</h2></div>
    <p class="desc">빌린 책을 돌려줘요. 성공하면 연체 일수가 나와요.</p>
    <form id="returnForm">
      <div class="fields">
        <div><label for="rBook">책 번호</label><input id="rBook" placeholder="B001" autocomplete="off"></div>
        <div><label for="rName">이름</label><input id="rName" placeholder="김민수" autocomplete="off"></div>
        <div><label for="rDay">며칠째</label><input id="rDay" placeholder="10" autocomplete="off"></div>
      </div>
      <button type="submit" disabled>반납하기</button>
    </form>
    <div id="returnResult" class="result" aria-live="polite"></div>
  </section>

  <section id="listCard">
    <div class="head"><div class="badge">📋</div><h2>대출 목록</h2></div>
    <p class="desc">이름을 넣으면 지금 빌리고 있는 책이 반납 기한 순서로 보여요.</p>
    <form id="loansForm">
      <div class="listRow">
        <div><label for="lName">이름</label><input id="lName" placeholder="김민수" autocomplete="off"></div>
        <button type="submit" disabled>목록 보기</button>
      </div>
    </form>
    <div id="loansResult" aria-live="polite"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
  // 이 웹은 규칙을 직접 판단하지 않습니다.
  // solution.py 파일을 그대로 불러와서 LibraryLoan의 borrow / return_book / get_loans 결과만 화면에 보여 줍니다.
  let py = null;

  const GLUE = `
from solution import LibraryLoan
import re

lib = LibraryLoan()   # 페이지가 열려 있는 동안 대출 기록을 계속 기억

def to_day(text):
    # 입력칸 글자를 파이썬 값으로만 바꿔서 그대로 넘김 (맞는지 틀린지는 solution.py가 판단)
    s = text.strip()
    if re.fullmatch(r"[+-]?\\d+", s):
        return int(s)
    try:
        return float(s)
    except ValueError:
        return s

def web_borrow(book_id, name, day):
    return lib.borrow(book_id.strip(), name.strip(), to_day(day))

def web_return(book_id, name, day):
    return lib.return_book(book_id.strip(), name.strip(), to_day(day))

def web_loans(name):
    return [[b, d] for (b, d) in lib.get_loans(name.strip())]
`;

  async function start() {
    const status = document.getElementById("status");
    try {
      py = await loadPyodide();
      const code = await (await fetch("solution.py", { cache: "no-store" })).text();
      py.FS.writeFile("solution.py", code);
      py.runPython(GLUE);
      document.querySelectorAll("button").forEach(b => b.disabled = false);
      status.textContent = "준비 완료 — solution.py 연결됨";
      status.className = "ready";
    } catch (e) {
      status.textContent = "시스템을 불러오지 못했어요: " + e;
      status.className = "error";
    }
  }

  // 결과 상자 그리기 (화면 표시만 담당)
  function show(el, ok, label, big, detail) {
    el.className = "result show " + (ok ? "ok" : "bad");
    el.innerHTML = "";
    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = ok ? "✓" : "✕";
    const text = document.createElement("div");
    for (const [cls, t] of [["label", label], ["big", big], ["detail", detail]]) {
      if (!t) continue;
      const s = document.createElement("span");
      s.className = cls;
      s.textContent = t;
      text.appendChild(s);
    }
    el.append(icon, text);
  }

  const v = id => document.getElementById(id).value;

  document.getElementById("borrowForm").addEventListener("submit", e => {
    e.preventDefault();
    const ok = py.globals.get("web_borrow")(v("bBook"), v("bName"), v("bDay"));
    const el = document.getElementById("borrowResult");
    if (ok === true) show(el, true, "대출", "성공", `${v("bName").trim()} · ${v("bBook").trim()}`);
    else show(el, false, "대출", "실패", "대출이 거절되었어요.");
  });

  document.getElementById("returnForm").addEventListener("submit", e => {
    e.preventDefault();
    const r = py.globals.get("web_return")(v("rBook"), v("rName"), v("rDay"));
    const el = document.getElementById("returnResult");
    if (r === -1) show(el, false, "반납", "실패", "반납이 거절되었어요.");
    else show(el, true, `반납 성공 · ${v("rBook").trim()}`, `연체 ${r}일`, "");
  });

  document.getElementById("loansForm").addEventListener("submit", e => {
    e.preventDefault();
    const proxy = py.globals.get("web_loans")(v("lName"));
    const rows = proxy.toJs();
    proxy.destroy();
    const box = document.getElementById("loansResult");
    box.innerHTML = "";
    const name = v("lName").trim();
    if (rows.length === 0) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = `${name ? name + "님은 " : ""}빌린 책이 없어요.`;
      box.appendChild(p);
      return;
    }
    const who = document.createElement("p");
    who.className = "who";
    who.textContent = `${name}님이 빌린 책 ${rows.length}권`;
    const wrap = document.createElement("div");
    wrap.className = "tableWrap";
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>#</th><th>책 번호</th><th>반납 기한</th></tr></thead>";
    const tbody = document.createElement("tbody");
    rows.forEach(([book, due], i) => {   // solution.py가 준 순서 그대로
      const tr = document.createElement("tr");
      const td0 = document.createElement("td"); td0.className = "num"; td0.textContent = i + 1;
      const td1 = document.createElement("td"); td1.className = "book"; td1.textContent = book;
      const td2 = document.createElement("td"); td2.textContent = `${due}일째까지`;
      tr.append(td0, td1, td2);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    box.append(who, wrap);
  });

  start();
</script>
</body>
</html>
